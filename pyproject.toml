[project]
name = "semantic-cache-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "granian>=2.8.4",
    "aiohttp>=3.14.5",
    "redis[hiredis]>=8.1.0",
    "redisvl[mcp]>=0.28.0",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
benchmarks = [
    "datasets>=3.0.0",  # vCache dataset (ADR-0004 §7)
]


[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
