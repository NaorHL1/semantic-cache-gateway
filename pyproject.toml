[project]
name = "semantic-cache-gateway"
version = "0.1.0"
description = "OpenAI-compatible AI gateway with a two-layer (exact + semantic) Redis cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "granian>=2.8",
    "pydantic-settings>=2.6",
    "redis>=6.0",
    "redisvl>=0.28",
    "fastembed>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
